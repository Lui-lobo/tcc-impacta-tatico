; Projeto PlatformIO - Deploy do modelo TinyML no ESP32
; TCC: Manutencao Preditiva de Rolamentos (dataset CWRU)
;
; Gravar no ESP32:  pio run -t upload
; Monitor serial:   pio device monitor

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; O TensorFlow Lite Micro exige C++17; o core Arduino-ESP32 2.x compila em gnu++11 por padrao.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DTF_LITE_STATIC_MEMORY

lib_deps =
    spaziochirale/Chirale_TensorFLowLite@^2.0.0
